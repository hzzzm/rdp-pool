# MVP compose: MySQL 8 (ruoyi + rdp_pool) + Redis + Go API + RuoYi-Vue3/UI + RuoYi Java + Nginx
# Admin UI: http://127.0.0.1:8080/  (admin / admin123)

services:
  mysql:
    image: mysql:8.0
    container_name: rdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
      MYSQL_DATABASE: rdp_pool
      MYSQL_USER: ${MYSQL_RDP_USER:-rdp_app}
      MYSQL_PASSWORD: ${MYSQL_RDP_PASSWORD:-rdp_pass}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-authentication-plugin=caching_sha2_password"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  redis:
    image: redis:7-alpine
    container_name: rdp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  go-api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: rdp-go-api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8081"
      MYSQL_DSN: "${MYSQL_RDP_USER:-rdp_app}:${MYSQL_RDP_PASSWORD:-rdp_pass}@tcp(mysql:3306)/rdp_pool?parseTime=true&loc=Local&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:-dev-pool-user-jwt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-jwt}
      CREDENTIAL_AES_KEY: ${CREDENTIAL_AES_KEY:-0123456789abcdef0123456789abcdef}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  # Optional full RuoYi Java (profile: ruoyi-java). Default MVP uses Go /ruoyi/ shim
  # behind /prod-api (see admin/docker/nginx-ruoyi.conf) because Maven deps often
  # time out on this network. Build when mirrors work:
  #   docker compose --profile ruoyi-java build ruoyi-admin
  ruoyi-admin:
    profiles: ["ruoyi-java"]
    build:
      context: ../admin
      dockerfile: docker/Dockerfile.admin
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: rdp-ruoyi-admin
    restart: unless-stopped
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_DATABASE: "1"
      SPRING_DATASOURCE_DRUID_MASTER_URL: "jdbc:mysql://mysql:3306/ruoyi?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8"
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot seed: group + demo user + Windows resource (reads DEMO_* from .env)
  seed:
    build:
      context: ../server
      dockerfile: Dockerfile.seed
    container_name: rdp-seed
    profiles: ["seed"]
    environment:
      MYSQL_DSN: "${MYSQL_RDP_USER:-rdp_app}:${MYSQL_RDP_PASSWORD:-rdp_pass}@tcp(mysql:3306)/rdp_pool?parseTime=true&loc=Local&charset=utf8mb4"
      CREDENTIAL_AES_KEY: ${CREDENTIAL_AES_KEY:-0123456789abcdef0123456789abcdef}
      DEMO_GROUP_CODE: ${DEMO_GROUP_CODE:-office}
      DEMO_GROUP_NAME: ${DEMO_GROUP_NAME:-办公桌面}
      DEMO_RESOURCE_NAME: ${DEMO_RESOURCE_NAME:-win-test-01}
      DEMO_RESOURCE_HOST: ${DEMO_RESOURCE_HOST:-10.126.126.4}
      DEMO_RESOURCE_PORT: ${DEMO_RESOURCE_PORT:-3389}
      DEMO_RDP_USERNAME: ${DEMO_RDP_USERNAME:-ciit}
      DEMO_RDP_PASSWORD: ${DEMO_RDP_PASSWORD:-}
      DEMO_POOL_USER: ${DEMO_POOL_USER:-demo}
      DEMO_POOL_PASSWORD: ${DEMO_POOL_PASSWORD:-demo123}
    depends_on:
      mysql:
        condition: service_healthy
      go-api:
        condition: service_healthy

  # Nginx hosts prebuilt RuoYi-Vue3 (scripts/build-admin-ui.ps1 → admin/ui-dist)
  # + proxies /prod-api → Java, /pool-api → Go
  nginx:
    build:
      context: ../admin
      dockerfile: docker/Dockerfile.ui
    container_name: rdp-nginx
    ports:
      - "8080:80"
    depends_on:
      - go-api

volumes:
  mysql_data:
