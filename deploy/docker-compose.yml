# MVP compose: MySQL 8 (rdp_pool + placeholder ruoyi DB) + Redis + Go API + Nginx
# RuoYi Java/Vue are documented under admin/ — mount separately when ready.

services:
  mysql:
    image: mysql:8.0
    container_name: rdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
      MYSQL_DATABASE: rdp_pool
      MYSQL_USER: ${MYSQL_RDP_USER:-rdp_app}
      MYSQL_PASSWORD: ${MYSQL_RDP_PASSWORD:-rdp_pass}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-authentication-plugin=caching_sha2_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_pass_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rdp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  go-api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: rdp-go-api
    environment:
      HTTP_ADDR: ":8081"
      MYSQL_DSN: "${MYSQL_RDP_USER:-rdp_app}:${MYSQL_RDP_PASSWORD:-rdp_pass}@tcp(mysql:3306)/rdp_pool?parseTime=true&loc=Local&charset=utf8mb4"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:-dev-pool-user-jwt}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-jwt}
      CREDENTIAL_AES_KEY: ${CREDENTIAL_AES_KEY:-0123456789abcdef0123456789abcdef}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: rdp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go-api

volumes:
  mysql_data:
