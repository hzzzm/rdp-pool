# Kept for reference / non-UI nginx fallback.
# Production compose builds admin/docker/nginx-ruoyi.conf into the nginx image.
upstream go_api {
    server go-api:8081;
}

upstream ruoyi_admin {
    server ruoyi-admin:8080;
}

server {
    listen 80;
    server_name _;

    location /healthz {
        proxy_pass http://go_api/healthz;
    }

    location /pool-api/ {
        proxy_pass http://go_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-RuoYi-Token $http_x_ruoyi_token;
    }

    location /prod-api/ {
        proxy_pass http://ruoyi_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        default_type text/plain;
        return 200 'Use the built nginx image (Dockerfile.ui) which serves RuoYi-Vue3.\n';
    }
}
