# Architecture §2.3 bridge 1: path split + dual tokens
# /prod-api/ → RuoYi Java (mount when available)
# /pool-api/ → Go control plane
# /          → RuoYi Vue static (placeholder)

upstream go_api {
    server go-api:8081;
}

server {
    listen 80;
    server_name _;

    location /healthz {
        proxy_pass http://go_api/healthz;
    }

    # Pool admin + user APIs via /pool-api prefix strip
    location /pool-api/ {
        proxy_pass http://go_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-RuoYi-Token $http_x_ruoyi_token;
    }

    # Placeholder for RuoYi Java — enable when ruoyi-admin is in compose
    # location /prod-api/ {
    #     proxy_pass http://ruoyi-admin:8080/;
    # }

    location / {
        default_type text/plain;
        return 200 'rdp-pool nginx OK. Mount RuoYi-Vue at / and enable /prod-api when ready.\nUse /pool-api/api/v1/... for Go API.\n';
    }
}
