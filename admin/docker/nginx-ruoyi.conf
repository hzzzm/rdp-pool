# Admin entry: RuoYi-Vue3 static + path split (§2.3)
# /prod-api → Go RuoYi shim (MVP); swap to ruoyi-admin when Java image builds.
# /pool-api → Go Admin API (admin_token)
upstream go_api {
    server go-api:8081;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location /healthz {
        proxy_pass http://go_api/healthz;
    }

    location /pool-api/ {
        proxy_pass http://go_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-RuoYi-Token $http_x_ruoyi_token;
    }

    # Vue VITE_APP_BASE_API=/prod-api → Go /ruoyi/ shim
    location /prod-api/ {
        proxy_pass http://go_api/ruoyi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
